// ── STORAGE ───────────────────────────────────────
const SK = "mpa_v2";
function loadState() {
  try { return JSON.parse(localStorage.getItem(SK)) || {}; } catch { return {}; }
}
function saveState(s) {
  try { localStorage.setItem(SK, JSON.stringify(s)); } catch {}
}

function calcNutrition(weight, heightIn, age, activityMult, leanMass) {
  const bmr = (10 * weight * 0.453592) + (6.25 * heightIn * 2.54) - (5 * age) - 161;
  const tdee = Math.round(bmr * activityMult);
  const deficit = Math.max(1400, Math.round(tdee - 350));
  const protein = Math.min(Math.round((leanMass || weight * 0.7) * 1.1), 160);
  const fat = Math.round((deficit * 0.30) / 9);
  const carbs = Math.max(0, Math.round((deficit - (protein * 4) - (fat * 9)) / 4));
  return { tdee, deficit, protein, fat, carbs, bmr: Math.round(bmr) };
}

function Tag({ children, style }) {
  return <span style={{...s.tag,...style}}>{children}</span>;
}
function InfoCard({ title, children }) {
  return <div style={s.infoCard}><div style={s.infoTitle}>{title}</div><div style={s.infoBody}>{children}</div></div>;
}
function ProgressBar({ value, color=C.sage }) {

// ── LIFTS TAB ─────────────────────────────────────
function LiftsTab({ state, setState }) {
  const [inputs, setInputs] = useState({});
  const history = state.liftHistory || {};

  const getWeekSessions = (id) => {
    const h = history[id] || [];
    const now = new Date();
    const start = new Date(now); start.setDate(now.getDate()-now.getDay()); start.setHours(0,0,0,0);
    return h.filter(s=>new Date(s.timestamp)>=start).length;
  };

  const logLift = (id) => {
    const inp = inputs[id] || {};
    if (!inp.weight || !inp.sets || !inp.reps) return;
    const entry = { weight: parseFloat(inp.weight), sets: parseInt(inp.sets), reps: parseInt(inp.reps), date: new Date().toLocaleDateString("en-US",{month:"short",day:"numeric"}), timestamp: Date.now() };
    setState(s => {
      const lh = {...(s.liftHistory||{})};
      lh[id] = [...(lh[id]||[]), entry].slice(-20);
      return {...s, liftHistory: lh};
    });
    setInputs(i=>({...i,[id]:{}}));
  };

  return (
    <div style={{paddingBottom:20}}>
      <div style={{padding:"24px 20px 0"}}>
        <p style={{fontSize:14,lineHeight:1.7,color:C.muted}}>Twice a week. Log your sets, weight, and reps. Keep it simple — just show up and move the bar.</p>
      </div>
      <div style={{padding:"16px 20px 0",display:"flex",flexDirection:"column",gap:14}}>
        {LIFTS.map(lift => {
          const h = (history[lift.id]||[]).slice(-5).reverse();
          const wk = getWeekSessions(lift.id);
          const inp = inputs[lift.id] || {};
          return (
            <div key={lift.id} style={{background:C.warm,border:`1px solid ${C.soft}`,borderRadius:16,padding:20}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
                <div style={{fontFamily:"serif",fontSize:18,fontWeight:500,color:C.deep}}>{lift.name}</div>
                <span style={{fontSize:10,letterSpacing:"0.12em",textTransform:"uppercase",background:C.soft,color:C.muted,padding:"3px 9px",borderRadius:12}}>{lift.badge}</span>
              </div>
              <div style={{display:"flex",gap:6,alignItems:"center",marginBottom:14}}>
                {[0,1].map(i=><div key={i} style={{width:8,height:8,borderRadius:"50%",background:wk>i?C.sage:C.soft}}/>)}
                <span style={{fontSize:11,color:C.muted,marginLeft:4}}>{wk}/2 this week</span>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:10}}>
                {["weight","sets","reps"].map(field=>(
                  <div key={field}>
                    <label style={s.label}>{field==="weight"?"Weight (lbs)":field.charAt(0).toUpperCase()+field.slice(1)}</label>
                    <input type="number" placeholder={field==="weight"?"135":field==="sets"?"3":"8"} value={inp[field]||""} onChange={e=>setInputs(i=>({...i,[lift.id]:{...inp,[field]:e.target.value}}))} style={s.input}/>
                  </div>
                ))}
              </div>
              <button onClick={()=>logLift(lift.id)} style={s.actionBtn}>Log Session</button>
              {h.length>0 && (
                <div style={{marginTop:12,borderTop:`1px solid ${C.soft}`,paddingTop:10}}>
                  <div style={{fontSize:10,letterSpacing:"0.12em",textTransform:"uppercase",color:C.taupe,marginBottom:6}}>Recent</div>
                  {h.map((e,i)=>(
                    <div key={i} style={{display:"flex",justifyContent:"space-between",fontSize:12,color:C.muted,padding:"3px 0"}}>
                      <span style={{fontWeight:500,color:C.deep}}>{e.sets}×{e.reps} @ {e.weight} lbs</span>
                      <span style={{fontSize:11,color:C.taupe}}>{e.date}</span>
                    </div>
                  ))}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ── WALK TAB ──────────────────────────────────────
function WalkTab({ state, setState }) {
  const walks = state.walks || {};
  const todayKey = new Date().toDateString();
  const walkedToday = walks[todayKey];

  const weekDays = (() => {
    const now = new Date(); const days=["Su","Mo","Tu","We","Th","Fr","Sa"]; const result=[];
    for(let i=6;i>=0;i--){const d=new Date(now);d.setDate(now.getDate()-i);result.push({label:days[d.getDay()],key:d.toDateString(),today:i===0});}
    return result;
  })();

  const streak = (() => {
    let s=0; const d=new Date();
    while(walks[d.toDateString()]){s++;d.setDate(d.getDate()-1);}
    return s;
  })();

  const toggle = (key) => {
    setState(s => {
      const w = {...(s.walks||{})};
      if(w[key]) delete w[key]; else w[key]=true;
      return {...s, walks:w};
    });
  };

  return (
    <div style={{paddingBottom:20}}>
      <div style={{padding:"28px 20px 0"}}>
        <Tag>Morning fasted walk · fat loss protocol</Tag>
        <p style={{fontSize:14,lineHeight:1.7,color:C.muted}}>One of the highest-leverage things you can do for body composition right now. Fasted, low-intensity, consistent. It works with your hormones — not against them.</p>
      </div>
      <div style={{padding:"20px 20px 0"}}>
        <div style={{...s.card}}>
          <div style={{display:"flex",alignItems:"center",gap:12,background:C.cream,borderRadius:10,padding:"12px 14px",marginBottom:14}}>
            <div style={{fontFamily:"serif",fontSize:36,color:C.amber,lineHeight:1}}>{streak}</div>
            <div>
              <div style={{fontSize:14,fontWeight:500,color:C.deep}}>{streak===1?"1 day streak":streak>1?`${streak} day streak`:"Start your streak"}</div>
              <div style={{fontSize:12,color:C.muted}}>{Object.keys(walks).length} total walks logged</div>
            </div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4,marginBottom:14}}>
            {weekDays.map(d=>(
              <div key={d.key} onClick={()=>toggle(d.key)} style={{aspectRatio:1,borderRadius:8,background:walks[d.key]?C.sage:C.soft,border:d.today?`1.5px solid ${C.amber}`:"1.5px solid transparent",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",cursor:"pointer",transition:"all 0.2s"}}>
                <div style={{fontSize:9,letterSpacing:"0.05em",textTransform:"uppercase",color:walks[d.key]?"rgba(255,255,255,0.75)":C.muted}}>{d.label}</div>
                {walks[d.key]&&<div style={{fontSize:12,color:"white"}}>✓</div>}
              </div>
            ))}
          </div>
          <button onClick={()=>toggle(todayKey)} style={{...s.actionBtn, background:walkedToday?C.sage:C.deep}}>{walkedToday?"✓ Walked Today":"Log Today's Walk"}</button>
        </div>

        <div style={{...s.blockLabel,marginBottom:12}}>Your Protocol<div style={{flex:1,height:1,background:C.soft}}/></div>
        {[
          {tag:"Phase 1 · Weeks 1–4",title:"20–30 min · fasted · easy pace",desc:"Before food, before coffee if possible. Heart rate stays conversational. This is Zone 2. Your body is burning fat, not glycogen. Don't make it harder than this.",active:true},
          {tag:"Phase 2 · Weeks 5–8",title:"35–45 min · fasted · slight incline or pace increase",desc:"Add a hill, treadmill incline, or light weighted vest. Still conversational. The progression is duration and terrain, not intensity."},
          {tag:"Advanced",title:"45–60 min · podcast walk · non-negotiable",desc:"This becomes your anchor habit. A long morning walk is one of the most underrated tools for perimenopause body composition, cortisol regulation, and mood."},
        ].map((p,i)=>(
          <div key={i} style={{background:C.cream,borderRadius:10,padding:14,marginBottom:8,borderLeft:`3px solid ${p.active?C.sage:C.soft}`}}>
            <div style={{fontSize:10,letterSpacing:"0.08em",textTransform:"uppercase",color:C.amber,fontWeight:500,marginBottom:4}}>{p.tag}</div>
            <div style={{fontSize:13,fontWeight:500,color:C.deep,marginBottom:3}}>{p.title}</div>
            <div style={{fontSize:12,color:C.muted,lineHeight:1.5}}>{p.desc}</div>
          </div>
        ))}

        <div style={{...s.blockLabel,marginTop:16,marginBottom:12}}>Why This Works For You<div style={{flex:1,height:1,background:C.soft}}/></div>
        <InfoCard title="🔥 Fat Oxidation">Fasted low-intensity cardio taps directly into fat stores. At 52, your insulin sensitivity is lower — walking fasted bypasses this and accesses stored fat more readily than food-fueled training.</InfoCard>
        <InfoCard title="🧠 Cortisol + Visceral Fat">Your visceral fat index of 11 is driven heavily by cortisol and declining estrogen. A quiet morning walk lowers cortisol rather than spiking it. You're managing stress hormones while burning fat.</InfoCard>
        <InfoCard title="💪 Muscle Preservation">Zone 2 walking doesn't touch your muscle tissue. Your strength training builds it — your walks burn fat around it. These two tools work together perfectly.</InfoCard>
        <InfoCard title="⏰ Consistency > Perfection">20 minutes every day beats 60 minutes twice a week. The metabolic and hormonal benefits compound with consistency. Show up even on the days you only have 15 minutes.</InfoCard>
      </div>
    </div>
  );

function ShoulderTab({ state, setState }) {
  const [expanded, setExpanded] = useState(null);
  const checked = state.shoulderChecked || {};

    p.exercises.map((ex, ei) => ({ ...ex, key: `${pi}-${ei}`, phase: p.phase }))
  );
  const doneCount = Object.values(checked).filter(Boolean).length;

  const toggle = (key) => {
    setState(s => ({...s, shoulderChecked: {...(s.shoulderChecked||{}), [key]: !(s.shoulderChecked||{})[key]}}));
  };

  return (
    <div style={{paddingBottom:20}}>
      <div style={{padding:"28px 20px 0"}}>
        <Tag>Right Shoulder · Corrective Protocol</Tag>
